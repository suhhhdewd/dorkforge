[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dorkforge"
version = "0.1.0"
description = "Emit-only search-query generator for authorized recon and personal footprint self-audit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dorkforge contributors" }]
keywords = [
    "osint",
    "dorks",
    "recon",
    "reconnaissance",
    "security",
    "footprint",
    "self-audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    # Test-only. Required by Starlette/FastAPI's TestClient; runs in-process
    # against the ASGI app and makes no real network calls. Not a runtime dep,
    # so the v1 "no HTTP client" constraint (which targets search-engine/target
    # traffic) is preserved.
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/suhhhdewd/dorkforge"
Repository = "https://github.com/suhhhdewd/dorkforge"

[project.scripts]
dorkforge = "dorkforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dorkforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
